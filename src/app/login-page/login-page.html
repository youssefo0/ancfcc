<div class="container">
  <div class="header">
    <div class="logo-section">
      <img src="ancfcc-logo.png" alt="ANCFCC Logo" class="logo">
    </div>
  </div>

  <div class="login-container">
    <div class="login-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10,17 15,12 10,7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
    </div>
    
    <h2 class="login-title">Se connecter</h2>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">

  <!-- CIN -->
  <div class="form-group">
    <label for="cin">CIN</label>
    <input 
      type="text" 
      id="cin" 
      name="cin" 
      [(ngModel)]="formData.cin" 
      required 
      minlength="5"
      #cin="ngModel"
      placeholder="Entrez votre CIN">
    <div *ngIf="cin.invalid && (cin.dirty || cin.touched)" class="error-message">
      <small *ngIf="cin.errors?.['required']">CIN requis</small>
      <small *ngIf="cin.errors?.['minlength']">Au moins 5 caractères</small>
    </div>
  </div>

  <!-- Numéro -->
  <div class="form-group">
    <label for="numero">Numéro</label>
    <div class="phone-verification">
      <input 
        type="tel" 
        id="numero" 
        name="numero" 
        [(ngModel)]="formData.numero" 
        required 
        pattern="^[0-9]{10}$"
        #numero="ngModel"
        placeholder="Numéro de téléphone">
      <button type="button" class="verify-btn" (click)="sendVerification()" [disabled]="numero.invalid">Vérifier</button>
    </div>
    <div *ngIf="numero.invalid && (numero.dirty || numero.touched)" class="error-message">
      <small *ngIf="numero.errors?.['required']">Numéro requis</small>
      <small *ngIf="numero.errors?.['pattern']">10 chiffres requis</small>
    </div>
  </div>

  <!-- Code vérification -->
  <div class="form-group">
    <label for="verification">Vérification</label>
    <input 
      type="text" 
      id="verification" 
      name="verification" 
      [(ngModel)]="formData.verification" 
      required 
      minlength="4"
      #verification="ngModel"
      placeholder="Code de vérification">
    <div *ngIf="verification.invalid && (verification.dirty || verification.touched)" class="error-message">
      <small *ngIf="verification.errors?.['required']">Code requis</small>
      <small *ngIf="verification.errors?.['minlength']">Trop court</small>
    </div>
  </div>

  <!-- Bouton -->
  <button type="submit" class="login-btn" [disabled]="!loginForm.valid">
    Suivant
  </button>

  <div class="signup-link">
    <p>Vous n'avez pas de compte? <a href="#" (click)="goToSignup($event)">Créer un compte</a></p>
  </div>
</form>

  </div>
</div>
