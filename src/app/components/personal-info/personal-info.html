<div class="container">
    <div class="sidebar">
      <div class="profile">
        <img src="assets/images/user-logo.png" alt="User" class="avatar" />
        <p class="username">User name</p>
      </div>
      <button class="menu-btn active">Information perso</button>
      <button class="menu-btn">Titre foncier</button>
      <button class="menu-btn">Historique</button>
      <button class="logout">Déconnecte</button>
    </div>
  
    <div class="form-container">
      
      <div class="form-box">
        <label>Nom :</label>
        <input type="text" required />
        <label>Prénom :</label>
        <input type="text" required />
        <label>CIN :</label>
        <input type="text" required />
        <label>Date de naissance :</label>
        <div class="date-row">
          <input type="number" placeholder="JJ" required />
          <input type="number" placeholder="MM" required />
          <input type="number" placeholder="AAAA" required />
        </div>
        <p class="arabic-label">الاسم الشخصي الكامل</p>
        <input type="text" required />
      </div>
  
      <div class="form-box">
        <label>Adresse :</label>
        <input type="text" required />
        <label>Courrier électronique :</label>
        <input type="email" required />
        <label>Numéro de téléphone :</label>
        <input type="tel" required />
        <button class="verify">vérifier</button>
        <input type="text" placeholder="Code vérification" required />
      </div>
  
      <div class="actions">
        <button class="save">Sauvegarde</button>
        <button class="cancel">Annule</button>
      </div>
    </div>
  </div>
